name: CI

# Runs on demand only (Actions tab -> CI -> "Run workflow", or `gh workflow run CI`).
# Automatic runs are paused while the GitHub account's Actions billing is unavailable;
# to run on every push again, replace this block with:
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check (imports)
        run: ruff check --select I .
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
      - name: Original CLI still works
        env:
          MPLBACKEND: Agg
        run: python double_pendulum.py --no-show --t-max 5
