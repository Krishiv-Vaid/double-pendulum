name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check (imports)
        run: ruff check --select I .
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: pytest -q
      - name: Original CLI still works
        env:
          MPLBACKEND: Agg
        run: python double_pendulum.py --no-show --t-max 5
