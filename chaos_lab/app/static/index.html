<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaos Lab Ultra</title>
  <meta name="description" content="Two pendulums. Infinite possibilities. Explore the mathematics of chaos.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070910'/%3E%3Cpath d='M16 6 L10 17 L20 26' stroke='%23F4F7FF' stroke-width='2' fill='none'/%3E%3Ccircle cx='10' cy='17' r='3' fill='%2300E5FF'/%3E%3Ccircle cx='20' cy='26' r='3' fill='%23FF3CAC'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Apply persisted theme/motion before first paint (no flash).
    try {
      const t = localStorage.getItem("cl.theme");
      if (t) document.documentElement.dataset.theme = t;
      const rm = localStorage.getItem("cl.reducedMotion");
      if (rm === "1" || (rm === null && matchMedia("(prefers-reduced-motion: reduce)").matches))
        document.documentElement.classList.add("reduced-motion");
    } catch (e) {}
  </script>
</head>
<body>
  <a class="sr-only" href="#view">Skip to content</a>
  <div class="app" id="app">
    <nav class="nav" aria-label="Main">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
          <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#FF3CAC"/></linearGradient></defs>
          <rect width="34" height="34" rx="9" fill="#101522" stroke="#222b40"/>
          <path d="M6 24 C10 8, 18 30, 28 10" stroke="url(#bm)" stroke-width="1.6" fill="none" opacity=".75"/>
          <path d="M17 6 L11 17 L21 26" stroke="#F4F7FF" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <circle cx="17" cy="6" r="1.8" fill="#95A3BA"/><circle cx="11" cy="17" r="3" fill="#00E5FF"/><circle cx="21" cy="26" r="3" fill="#FF3CAC"/>
        </svg>
        <div class="brand-name">Chaos Lab Ultra<small>nonlinear dynamics studio</small></div>
      </div>
      <ul class="nav-list" id="nav-list"></ul>
      <div class="nav-foot">
        <button class="btn ghost sm" id="btn-theme" data-tip="Toggle light/dark theme (T)">Theme</button>
        <button class="btn ghost sm" id="btn-motion" data-tip="Reduced motion: disables particles, motion blur and flashes">Motion</button>
        <button class="btn ghost sm" id="btn-collapse" data-tip="Collapse navigation">⟨⟩</button>
      </div>
    </nav>
    <div class="main">
      <header class="topbar">
        <div>
          <h1 id="view-title">Playground</h1>
          <div class="subtitle" id="view-subtitle"></div>
        </div>
        <div class="spacer"></div>
        <div id="topbar-extra" class="btn-row"></div>
        <button class="btn sm" id="btn-palette" data-tip="Command palette">Commands <kbd>⌘K</kbd></button>
        <button class="btn sm ghost" id="btn-help" data-tip="Keyboard shortcuts (?)">?</button>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p style="padding:2rem">Chaos Lab Ultra needs JavaScript to render simulations.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
